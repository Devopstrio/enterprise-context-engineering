apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-context-engineering
  labels:
    app: context-engineering
spec:
  replicas: 3
  selector:
    matchLabels:
      app: context-engineering
  template:
    metadata:
      labels:
        app: context-engineering
    spec:
      serviceAccountName: context-engineering-sa
      containers:
        - name: app
          image: enterprise-context-engineering:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: context-engineering-config
