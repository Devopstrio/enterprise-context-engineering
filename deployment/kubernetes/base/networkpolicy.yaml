apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: context-engineering-np
spec:
  podSelector:
    matchLabels:
      app: context-engineering
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 443
