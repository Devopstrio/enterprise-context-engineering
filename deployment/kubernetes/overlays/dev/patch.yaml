apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-context-engineering
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              memory: "256Mi"
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: ENVIRONMENT
              value: "dev"
