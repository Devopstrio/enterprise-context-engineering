apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-context-engineering
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          env:
            - name: LOG_LEVEL
              value: "WARNING"
            - name: ENVIRONMENT
              value: "production"
