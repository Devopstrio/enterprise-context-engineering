apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-context-engineering
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              memory: "512Mi"
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: ENVIRONMENT
              value: "staging"
